name: CI

# Тесты стека через задачи mise. В самом шаблоне test заглушка, поэтому здесь
# job пропускается, а в репозитории из шаблона он красный до первой настройки
# (AGENTS.md). Линтеры стека идут шагами hk и запускаются в check.yml.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    if: github.repository != 'hexlet-components/component-template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - run: mise run setup
      - run: mise run test
